# Cabeceras de seguridad (OWASP A05).
#
# Están en un archivo aparte y no en el server porque nginx no las hereda: si
# un `location` declara aunque sea un `add_header` propio, pierde todos los del
# nivel de arriba. `/assets/` declara el suyo de caché, así que sin este
# include los archivos estáticos salían sin ninguna cabecera de seguridad.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# `'unsafe-inline'` en los estilos es lo que pide la aplicación: los temas se
# aplican escribiendo variables CSS en el elemento raíz, y eso son estilos en
# línea. En los scripts no hace falta, así que no está: sin esa excepción, un
# XSS no puede ejecutar lo que inyecte.
#
# `connect-src 'self'` alcanza porque la API viaja por el mismo origen, a
# través del proxy de nginx.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
