# TLS para el despliegue real (OWASP A02).
#
# Este archivo NO está activo en la imagen: la demostración corre en localhost
# y un certificado autofirmado agrega una advertencia del navegador en el medio
# de la defensa sin proteger nada. Lo que sí queda resuelto es la
# configuración, para que poner el sistema detrás de TLS sea montar dos
# archivos y cambiar una línea, y no un trabajo de investigación el día del
# despliegue.
#
# Cómo se activa, con el certificado y la clave del dominio:
#
#     docker compose run -d -p 443:443 \
#       -v /ruta/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro \
#       -v /ruta/privkey.pem:/etc/nginx/tls/privkey.pem:ro \
#       -v ./frontend/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro \
#       web
#
# La cadena la emite quien corresponda —Let's Encrypt en un despliegue propio,
# el balanceador en un despliegue gestionado—. Lo que no cambia es lo de acá:
# qué protocolos se aceptan, qué cifrados y qué cabeceras.

# El puerto 80 sólo redirige. Dejarlo sirviendo la aplicación en texto plano
# haría que la primera visita viaje sin cifrar aunque después haya HSTS.
server {
    listen 80;
    server_name _;

    # El desafío de renovación del certificado tiene que seguir entrando por
    # HTTP: es la única excepción.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # Sólo TLS 1.2 y 1.3. Las versiones anteriores están rotas y aceptarlas
    # deja que un atacante en el medio negocie la peor que el cliente admita.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/cabeceras-de-seguridad.conf;

    # HSTS va acá y no en el archivo de cabeceras comunes: mandarlo por HTTP no
    # tiene efecto y confunde a quien lee la configuración. Un año, con los
    # subdominios incluidos.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Con TLS terminado acá, la API tiene que saber que el cliente vino por
        # https: es lo que mira para marcar las cookies como seguras.
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /assets/ {
        include /etc/nginx/cabeceras-de-seguridad.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
